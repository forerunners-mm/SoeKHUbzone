name: Soe Kalayar To-do reminders

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      label:
        description: "Optional reminder label"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: soe-kalayar-todo-reminders
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Send Myanmar-time task briefing
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: \${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          SOEKHUB_GOOGLE_SHEET_ID: \${{ secrets.SOEKHUB_GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: \${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TODO_SHEET_NAME: \${{ secrets.TODO_SHEET_NAME }}
          REMINDER_LABEL: \${{ github.event.inputs.label }}
        run: node todo-reminders.js
